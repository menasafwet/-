<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آسف يا حبيبتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3E6EC; --ink:#3A2142; --muted:#6E5577; --card:#FFFFFF; --line:#D9BFCB;
  --accent:#C2456B; --accent-ink:#FFFFFF; --bowl:#FFFFFF; --pud:#F7EFE0; --cin:#A85A1E; --pist:#7FA36B; --stars:0;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241636; --ink:#F6ECF1; --muted:#C6B2D1; --card:#33204A; --line:#4B345F;
    --accent:#F08FA9; --accent-ink:#2A1238; --bowl:#E8E1F2; --cin:#C77A33; --pist:#9DBF8A; --stars:1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241636; --ink:#F6ECF1; --muted:#C6B2D1; --card:#33204A; --line:#4B345F;
  --accent:#F08FA9; --accent-ink:#2A1238; --bowl:#E8E1F2; --cin:#C77A33; --pist:#9DBF8A; --stars:1;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  font-size:1.125rem; line-height:1.75;
  display:flex; align-items:center; justify-content:center; padding:2rem 1.25rem;
  position:relative; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:var(--stars);
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff 60%, transparent 62%),
    radial-gradient(1px 1px at 78% 12%, #fff 60%, transparent 62%),
    radial-gradient(2px 2px at 88% 40%, #fff 60%, transparent 62%),
    radial-gradient(1px 1px at 30% 70%, #fff 60%, transparent 62%),
    radial-gradient(1.5px 1.5px at 62% 84%, #fff 60%, transparent 62%),
    radial-gradient(1px 1px at 8% 90%, #fff 60%, transparent 62%),
    radial-gradient(1px 1px at 46% 6%, #fff 60%, transparent 62%);
}
main{position:relative; width:100%; max-width:30rem; text-align:center}
h1{
  font-family:"Aref Ruqaa","Amiri","Traditional Arabic",serif; font-weight:700;
  font-size:clamp(2.6rem,11vw,4rem); line-height:1.25; margin:0 0 .75rem;
}
h2{font-family:"Aref Ruqaa","Amiri",serif; font-size:clamp(1.9rem,8vw,2.6rem); line-height:1.3; margin:.5rem 0 .5rem}
p{margin:0 0 1rem; max-width:34ch; margin-inline:auto}
.muted{color:var(--muted)}
.ask{font-size:1.5rem; font-weight:700; margin:1.75rem 0 1.25rem}
.row{display:flex; flex-wrap:wrap; gap:.75rem; justify-content:center; min-height:4rem; align-items:center}
button{
  font:inherit; font-weight:700; cursor:pointer; border-radius:999px; padding:.7rem 1.6rem;
  border:2px solid var(--accent); background:transparent; color:var(--ink);
  transition:transform .2s ease, background .2s ease, color .2s ease;
}
button.primary{background:var(--accent); color:var(--accent-ink)}
button:hover{transform:translateY(-2px)}
button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
#no{transition:transform .25s ease}
.bowl{width:min(15rem,70vw); height:auto; display:block; margin:0 auto .5rem}
.drop{animation:drop .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{from{transform:translateY(-40px) scale(.9); opacity:0} to{transform:none; opacity:1}}
.card{background:var(--card); border:1px solid var(--line); border-radius:1.25rem; padding:1.25rem 1rem; margin-top:1.5rem}
.card p{margin-bottom:.75rem}
#confirm{font-weight:700; min-height:3.5rem; margin-top:1.25rem}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){
  .drop{animation:none} button,#no{transition:none}
}
</style>
</head>
<body>
<main>
  <section id="s1" aria-labelledby="t1">
    <h1 id="t1">أنا آسف يا حبيبتي</h1>
    <p>غلطت، وعارف إني غلطت. مش جاي أبرر، جاي أصلّح.</p>
    <p class="muted">وعملتلك حاجة صغيرة، بس لازم الأول أسألك سؤال.</p>
    <div class="ask">تسامحيني؟</div>
    <div class="row">
      <button class="primary" id="yes" type="button">مسامحاك</button>
      <button id="no" type="button">لأ</button>
    </div>
  </section>

  <section id="s2" hidden aria-labelledby="t2">
    <svg class="bowl drop" viewBox="0 0 200 150" role="img" aria-label="طبق رز بلبن بالقرفة">
      <ellipse cx="100" cy="142" rx="70" ry="6" fill="var(--ink)" opacity=".12"/>
      <path d="M20 70 Q20 136 100 136 Q180 136 180 70 Z" fill="var(--bowl)" stroke="var(--line)" stroke-width="2"/>
      <path d="M24 92 Q100 112 176 92" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
      <path d="M28 70 Q100 18 172 70 Q100 84 28 70Z" fill="var(--pud)"/>
      <ellipse cx="100" cy="70" rx="80" ry="12" fill="none" stroke="var(--line)" stroke-width="2"/>
      <g fill="var(--cin)">
        <circle cx="82" cy="50" r="2.2"/><circle cx="96" cy="44" r="2"/><circle cx="110" cy="48" r="2.4"/>
        <circle cx="124" cy="55" r="2"/><circle cx="70" cy="58" r="2"/><circle cx="100" cy="58" r="2.3"/>
        <circle cx="136" cy="62" r="1.8"/><circle cx="88" cy="66" r="1.8"/><circle cx="114" cy="66" r="2"/>
      </g>
      <g fill="var(--pist)">
        <rect x="92" y="51" width="6" height="3" rx="1.5" transform="rotate(-20 95 52)"/>
        <rect x="116" y="57" width="6" height="3" rx="1.5" transform="rotate(25 119 58)"/>
        <rect x="76" y="62" width="6" height="3" rx="1.5" transform="rotate(10 79 63)"/>
      </g>
    </svg>
    <h2 id="t2" tabindex="-1">شكرًا، بجد</h2>
    <p>عشان الزعل يحلو: طبق رز بلبن بالقرفة، وعليّا أنا.</p>

    <div class="card">
      <p><strong>والليلة؟ ننزل بليل؟</strong></p>
      <p class="muted">اختاري الميعاد اللي يريحك:</p>
      <div class="row" id="times">
        <button type="button" data-t="الساعة ٤">٤</button>
        <button type="button" data-t="الساعة ٥">٥</button>
        <button type="button" data-t="الساعة ٦">٦</button>
        <button type="button" data-t="any">أي وقت تحبيه</button>
      </div>
    </div>
    <div id="confirm" aria-live="polite"></div>
  </section>
</main>

<script>
(function(){
  var s1=document.getElementById('s1'), s2=document.getElementById('s2');
  var yes=document.getElementById('yes'), no=document.getElementById('no');
  var confirmEl=document.getElementById('confirm');
  var dodges=0;
  var lines=['لأ؟ طب جرّبي تاني','متأكدة؟','حتى الزرار مش عاوزك تقولي لأ'];

  function dodge(e){
    if(e && e.preventDefault) e.preventDefault();
    dodges++;
    var dx=(Math.random()*160-80), dy=(Math.random()*90-45);
    no.style.transform='translate('+dx+'px,'+dy+'px) scale('+Math.max(.6,1-dodges*.08)+')';
    no.textContent=lines[Math.min(dodges-1,lines.length-1)];
  }
  no.addEventListener('pointerenter',dodge);
  no.addEventListener('click',dodge);

  yes.addEventListener('click',function(){
    s1.hidden=true; s2.hidden=false;
    document.getElementById('t2').focus();
  });

  var btns=document.querySelectorAll('#times button');
  Array.prototype.forEach.call(btns,function(b){
    b.addEventListener('click',function(){
      Array.prototype.forEach.call(btns,function(x){x.setAttribute('aria-pressed','false')});
      b.setAttribute('aria-pressed','true');
      var t=b.getAttribute('data-t');
      confirmEl.textContent = t==='any'
        ? 'قوليلي إنتي الوقت اللي يريحك، وأنا هكون جاهز ومعايا الرز بلبن.'
        : 'تمام. هعدّي عليكي '+t+'، ومعايا الرز بلبن.';
    });
  });
})();
</script>
</body>
</html>
